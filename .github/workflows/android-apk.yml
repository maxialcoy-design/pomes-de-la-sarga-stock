name: Build Pomes de la Sarga APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'config.js'
      - 'manifest.webmanifest'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pomes-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar archivos de la aplicación
        run: |
          mkdir -p www
          cp index.html config.js www/
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/; fi
          mkdir -p www/assets/logo
          cp assets/logo/pomes-logo.png www/assets/logo/pomes-logo.png

      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Crear iconos Android clásicos y adaptativos
        run: |
          npm install --no-save sharp
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const source = 'assets/logo/pomes-logo.png';
          const root = 'android/app/src/main/res';
          const densities = [
            ['mdpi', 48], ['hdpi', 72], ['xhdpi', 96],
            ['xxhdpi', 144], ['xxxhdpi', 192]
          ];
          (async () => {
            if (!fs.existsSync(source)) throw new Error('Falta logo oficial: ' + source);
            for (const [density, size] of densities) {
              const dir = path.join(root, 'mipmap-' + density);
              fs.mkdirSync(dir, { recursive: true });
              const classic = await sharp(source)
                .resize(size, size, { fit: 'contain', background: '#ffffff' })
                .png().toBuffer();
              fs.writeFileSync(path.join(dir, 'ic_launcher.png'), classic);
              fs.writeFileSync(path.join(dir, 'ic_launcher_round.png'), classic);
              // Android 8+ lee el foreground del icono adaptativo.
              const adaptiveSize = Math.round(size * 108 / 48);
              const foreground = await sharp(source)
                .resize(Math.round(adaptiveSize * 0.60), Math.round(adaptiveSize * 0.60),
                  { fit: 'contain', background: { r: 255, g: 255, b: 255, alpha: 0 } })
                .png().toBuffer();
              const layer = await sharp({
                create: { width: adaptiveSize, height: adaptiveSize,
                  channels: 4, background: { r: 255, g: 255, b: 255, alpha: 0 } }
              }).composite([{ input: foreground, gravity: 'centre' }]).png().toBuffer();
              fs.writeFileSync(path.join(dir, 'ic_launcher_foreground.png'), layer);
              // Evitar que los webp por defecto oculten los nuevos PNG.
              for (const name of ['ic_launcher.webp','ic_launcher_round.webp','ic_launcher_foreground.webp']) {
                const file = path.join(dir, name);
                if (fs.existsSync(file)) fs.unlinkSync(file);
              }
            }
            const xmlDir = path.join(root, 'mipmap-anydpi-v26');
            fs.mkdirSync(xmlDir, { recursive: true });
            const xml = [
              '<?xml version="1.0" encoding="utf-8"?>',
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">',
              '  <background android:drawable="@android:color/white"/>',
              '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>',
              '</adaptive-icon>', ''
            ].join(String.fromCharCode(10));
            for (const name of ['ic_launcher.xml','ic_launcher_round.xml']) {
              fs.writeFileSync(path.join(xmlDir, name), xml);
            }
            console.log('Iconos clásicos y adaptativos creados con logo oficial');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

          
      - name: Configurar icono adaptable oficial
        run: |
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@android:color/white" />
            <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Sincronizar aplicación
        run: npx cap sync android

      - name: Generar APK de prueba
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Pomes-de-la-Sarga-APK-prueba
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
